<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Урок</title>
<style>
html,body{margin:0;height:100%;background:#fff;overflow:hidden}
#f{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
.btns{position:fixed;z-index:5;top:calc(env(safe-area-inset-top,0px) + 10px);left:calc(env(safe-area-inset-left,0px) + 10px);display:flex;gap:8px;transition:opacity .3s}
.btns a{font:700 14px/1 system-ui,-apple-system,sans-serif;text-decoration:none;color:#fff;background:rgba(20,18,40,.72);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);padding:10px 14px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.btns.dim{opacity:.35}
.btns:hover,.btns:active{opacity:1}
#err{display:none;position:fixed;inset:0;align-items:center;justify-content:center;text-align:center;padding:24px;font:600 18px/1.4 system-ui,sans-serif;color:#333}
</style>
</head>
<body>
<iframe id="f" allow="fullscreen; autoplay; clipboard-write" allowfullscreen referrerpolicy="no-referrer-when-downgrade"></iframe>
<div class="btns" id="btns">
  <a href="../">← Начало</a>
  <a id="ext" href="#" target="_blank" rel="noopener" title="Отвори сайта нормално">↗</a>
</div>
<div id="err">Няма линк за отваряне.</div>
<script>
(function(){
  var u=new URLSearchParams(location.search).get('u')||'';
  if(!/^https?:\/\//i.test(u)){document.getElementById('err').style.display='flex';return}
  document.getElementById('f').src=u;
  document.getElementById('ext').href=u;
  try{document.title=new URL(u).hostname}catch(e){}
  // fade the buttons a little after a few seconds so they don't cover the lesson
  setTimeout(function(){document.getElementById('btns').classList.add('dim')},4000);
})();
</script>
</body>
</html>
